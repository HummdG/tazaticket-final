# Redis configuration for 512MB instance

# Set max memory to leave some room for the Python app
maxmemory 384mb

# Use LRU eviction policy to remove least recently used keys when memory is full
maxmemory-policy allkeys-lru

# Enable memory compaction to reduce fragmentation
activedefrag yes
lazyfree-lazy-eviction yes

# Basic settings
bind 127.0.0.1
port 6379
timeout 0
tcp-keepalive 300

# Logging
loglevel notice
logfile ""

# Databases
databases 1

# Save settings (disable persistence for this use case)
save ""
appendonly no

# Security
# requirepass yourpassword  # Uncomment and set if you need password protection